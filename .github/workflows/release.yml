name: Release

# Push a tag like v1.2.0 to build the portable zip and attach it to a
# draft GitHub release. The release is left as a DRAFT on purpose — review
# and publish it by hand so nothing goes public without a human click.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish Mylist/MyList.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath MyList-win-x64.zip -CompressionLevel Optimal

      - name: Draft release + attach asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag MyList-win-x64.zip --clobber
          } else {
            gh release create $tag MyList-win-x64.zip --draft --title "MyList $tag" --generate-notes
          }
